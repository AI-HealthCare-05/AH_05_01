# infra/nginx/prod_http.conf
#
# ⚠️ 2026-09-14 신규 - EC2 팀 내부 테스트 배포용(도메인·SSL 없이 IP+HTTP로만 먼저 연결).
# infra/nginx/prod.conf(도메인+HTTPS 전환 시 쓸 파일, acme-challenge 경로 포함)와는
# 별개로 관리 - 이번 HTTP 전용 테스트는 이 파일을 씀.
#
# server_name의 IP(54.144.123.148)는 2026-09-14 Elastic IP로 고정 할당한 주소입니다.
# 이제 인스턴스를 중지(Stop)했다가 재시작(Start)해도 이 IP는 안 바뀝니다.

upstream fastapi {
    server fastapi:8000;
}

server {
    server_name 54.144.123.148;

    listen 80;

    # /api/ 로 시작하는 요청만 FastAPI로 전달 (이 프로젝트의 실제 라우터 prefix는 /api/v1)
    location /api/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # /api/ 이외의 모든 요청 차단
    location / {
        return 404;
    }
}
