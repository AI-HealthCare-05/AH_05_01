# infra/nginx/prod.conf
#
# ⚠️ 2026-09-14 신규 - EC2 배포용. 로컬 개발용 infra/nginx/default.conf와는 별개 파일.
# 가이드 템플릿을 그대로 따르되, 이 프로젝트의 실제 API prefix(/api/v1)와 EC2 IP에 맞춤.

upstream fastapi {
    server fastapi:8000;
}

server {
    # ⚠️ 실제 EC2 퍼블릭 IP로 채워둠. 나중에 도메인을 연결하면 그 도메인으로 바꿀 것.
    server_name 54.144.123.148;

    listen 80;

    # Let's Encrypt 인증서 발급/갱신용 (도메인 연결 후 HTTPS 적용할 때 사용)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # /api/ 로 시작하는 요청만 FastAPI로 전달 (이 프로젝트의 실제 라우터 prefix는 /api/v1)
    location /api/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # /api/ 이외의 모든 요청 차단
    location / {
        return 404;
    }
}
