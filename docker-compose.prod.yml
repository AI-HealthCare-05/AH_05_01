# docker-compose.prod.yml
#
# ⚠️ 2026-09-14 신규 - EC2 배포용. 로컬 개발용 docker-compose.yml과 차이점:
#   - fastapi: --reload, 로컬 코드 볼륨 마운트 제거 (배포는 이미지에 빌드된 코드를 그대로 씀 -
#     app/Dockerfile의 기본 CMD가 이미 프로덕션 설정(--workers 3, reload 없음)이라 command 자체를 생략)
#   - platforms: EC2(amd64)만 남김 (로컬 개발용은 M1/M2 맥(arm64)도 같이 빌드했었음)
#   - nginx가 infra/nginx/prod.conf(EC2 IP 반영본)를 사용
#
# 실행:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  # 1. Redis (메시지 브로커 및 캐싱)
  redis:
    image: redis:7.2.15-alpine
    container_name: redis
    networks:
      - ws
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. Database
  mysql:
    image: mysql:8.0.46
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: 'Asia/Seoul'
    ports:
      - ${DB_EXPOSE_PORT}:${DB_PORT}
    networks:
      - ws
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --port=${DB_PORT}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. API Server (FastAPI)
  fastapi:
    container_name: fastapi
    build:
      context: .
      dockerfile: app/Dockerfile
      platforms:
        - linux/amd64  # EC2는 amd64 아키텍처
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    env_file: .env.prod
    # ⚠️ command를 명시 안 함 - app/Dockerfile의 CMD(uvicorn --workers 3, --reload 없음)를
    # 그대로 씀. 로컬 개발용 compose처럼 --reload를 쓰면 배포 환경에서 불필요한 자원을 쓰고,
    # 코드 볼륨 마운트도 안 함(이미지에 빌드 시점 코드가 고정돼 있어야 배포가 재현 가능함).
    volumes:
      - static_volume:/app/templates
    restart: always
    ports:
      - "8000:8000"
    networks:
      - ws
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. AI Worker (Model 학습 및 추론)
  ai-worker:
    container_name: ai-worker
    build:
      context: .
      dockerfile: ai_worker/Dockerfile
      platforms:
        - linux/amd64
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}
    env_file: .env.prod
    restart: always
    mem_limit: 4G
    networks:
      - ws
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4-1. 튼튼지수 vNext(또래 백분위) 모델 브릿지. fastapi와 네트워크 네임스페이스를 공유해서
  # fastapi가 자신의 localhost:8766으로 접근함(원본 server.py가 127.0.0.1에 고정 바인딩돼
  # 있어서 - 무결성 검증 대상이라 코드는 건드리지 않음). 외부(nginx)에 직접 노출 안 됨.
  tuntun-peer-bridge:
    container_name: tuntun-peer-bridge
    build:
      context: .
      dockerfile: tuntun_peer_bridge/Dockerfile
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:tuntun-peer-bridge-${TUNTUN_PEER_BRIDGE_VERSION:-v0.2.0}
    restart: always
    mem_limit: 1G
    network_mode: "service:fastapi"
    depends_on:
      - fastapi

  # 5. Nginx (웹 서버 - 요청 리버스 프록시로 전달)
  nginx:
    container_name: nginx
    image: nginx:1.28.3-alpine
    volumes:
      # ⚠️ 2026-09-14 변경 - 팀 내부 HTTP 테스트 배포 단계라 prod_http.conf(도메인/SSL 없음)를
      # 씀. 나중에 도메인+HTTPS로 전환하면 이 줄을 infra/nginx/prod.conf로 다시 바꿀 것.
      - ./infra/nginx/prod_http.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/vol/web/static
    ports:
      - "80:80"
    networks:
      - ws
    depends_on:
      - fastapi

volumes:
  mysql_data:
  static_volume:

networks:
  ws:
    driver: bridge
