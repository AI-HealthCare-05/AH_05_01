    type: regression
    eligibility: waist_target_eligible
    label: waist_cm
    observed_value_outside_eligibility: preserve_upstream_exclude_from_task
  diabetes:
    type: classification
    eligibility: diabetes_target_eligible
    label: diabetes_measurement_label_raw
    label_outside_eligibility: fail_closed
  hypertension:
    type: classification
    eligibility: hypertension_target_eligible
    label: hypertension_measurement_label_raw
    label_outside_eligibility: fail_closed

task_preparation:
  eligibility_required: true
  label_required: true
  six_feature_complete_case_required: true
  feature_imputation: prohibited
  feature_clipping: prohibited
  measured_waist_as_disease_input: prohibited

resampling:
  type: nested_cross_fitting
  outer_folds: 5
  inner_folds: 4
  primary_seed: 42
  stability_seeds: [42, 1042, 2042]
  assignment_key: [source_year, participant_id]
  outer_holdout_in_inner_registry: prohibited

