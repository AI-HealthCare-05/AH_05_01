schema_version: 1
audit_version: v0.1
status: draft
survey: KNHANES
years: [2019, 2020, 2021, 2022, 2023, 2024]

privacy:
  schema_only: true
  allow_sample_rows: false
  allow_value_counts: false
  allow_missing_rates: false
  allow_descriptive_statistics: false
  holdout_years: [2024]

concepts:
  participant_id:
    description: 조사대상자 식별키
    candidate_columns: [ID, id, record_key]
    contract_required: true

  survey_year:
    description: 조사연도
    candidate_columns: [year, source_survey_year]
    contract_required: true

  age:
    description: 만 나이
    candidate_columns: [age, age_years]
    contract_required: true

  sex:
    description: 성별
    candidate_columns: [sex, sex_code]
    contract_required: true

  measured_height:
    description: 실측 신장(cm)
    candidate_columns: [HE_ht, height_cm]
    contract_required: true

  measured_weight:
    description: 실측 체중(kg)
    candidate_columns: [HE_wt, weight_kg]
    contract_required: true

  measured_waist:
    description: 실측 허리둘레(cm)
    candidate_columns: [HE_wc, waist_cm]
    contract_required: true

  aerobic_work_vigorous:
    description: 일 관련 고강도 활동 여부·일수·하루 시간·분
    required_columns: [BE3_71, BE3_72, BE3_73, BE3_74]
    contract_required: false

  aerobic_leisure_vigorous:
    description: 여가 고강도 활동 여부·일수·하루 시간·분
    required_columns: [BE3_75, BE3_76, BE3_77, BE3_78]
    contract_required: false

  aerobic_work_moderate:
    description: 일 관련 중강도 활동 여부·일수·하루 시간·분
    required_columns: [BE3_81, BE3_82, BE3_83, BE3_84]
    contract_required: false

  aerobic_leisure_moderate:
    description: 여가 중강도 활동 여부·일수·하루 시간·분
    required_columns: [BE3_85, BE3_86, BE3_87, BE3_88]
    contract_required: false

  aerobic_transport:
    description: 이동 신체활동 여부·일수·하루 시간·분
    required_columns: [BE3_91, BE3_92, BE3_93, BE3_94]
    contract_required: false

  walking:
    description: 걷기 일수·하루 시간·분
    required_columns: [BE3_31, BE3_32, BE3_33]
    contract_required: false

  strength_days:
    description: 최근 1주일간 근력운동 일수
    candidate_columns: [BE5_1, strength_days_week, strength_frequency]
    contract_required: false

  aerobic_threshold:
    description: 유산소 신체활동 기준 충족 생성변수
    candidate_columns: [pa_aerobic, aerobic_activity]
    contract_required: false

  fasting_glucose:
    description: 공복혈당 측정값
    candidate_columns: [HE_glu, fasting_glucose]
    contract_required: true

  hba1c:
    description: 당화혈색소 측정값
    candidate_columns: [HE_HbA1c, hba1c]
    contract_required: true

  systolic_blood_pressure:
    description: 수축기혈압 원측정 또는 공식 생성값 후보
    candidate_columns: [HE_sbp, HE_sbp1, HE_sbp2, HE_sbp3, systolic_bp]
    contract_required: true

  diastolic_blood_pressure:
    description: 이완기혈압 원측정 또는 공식 생성값 후보
    candidate_columns: [HE_dbp, HE_dbp1, HE_dbp2, HE_dbp3, diastolic_bp]
    contract_required: true

  examination_weight:
    description: 검진·건강설문 결합 분석 가중치 후보
    candidate_columns: [wt_itvex]
    contract_required: false

  strata:
    description: 복합표본 층화변수 후보
    candidate_columns: [kstrata]
    contract_required: false

  psu:
    description: 복합표본 집락변수 후보
    candidate_columns: [psu]
    contract_required: false
