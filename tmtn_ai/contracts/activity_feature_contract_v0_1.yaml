interpretation:
  korean_adult_age: 19_to_64
  who_adult_age: 18_to_64
  knhanes_model_cohort_age: 19_plus
  age_definitions_are_not_interchangeable: true
  recommendation_threshold_is_not_a_disease_label: true
  moderate_equivalent_minutes_are_not_MET_minutes: true
  activity_features_are_self_report_proxies: true

raw_code_rules:
  participation:
    yes: 1
    no: 2
    structural_not_applicable: 8
    unknown_or_nonresponse: 9
  days:
    valid: [1, 2, 3, 4, 5, 6, 7]
    structural_not_applicable: 8
    unknown_or_nonresponse: 9
  hours:
    valid_range: [0, 23]
    structural_not_applicable: 88
    unknown_or_nonresponse: 99
  minutes:
    valid_range: [0, 59]
    structural_not_applicable: 88
    unknown_or_nonresponse: 99
  branch_rule:
    participation_no: weekly_minutes_zero_ignore_subordinate_skip_codes
    participation_yes: require_valid_days_hours_and_minutes
    structural_not_applicable_or_unknown: missing_not_zero

official_pa_aerobic_reproduction:
  role: audit_and_research_comparator_only
  prohibited_as_app_aligned_feature: true
  required_raw_columns:
    work_vigorous: [BE3_71, BE3_72, BE3_73, BE3_74]
    leisure_vigorous: [BE3_75, BE3_76, BE3_77, BE3_78]
    work_moderate: [BE3_81, BE3_82, BE3_83, BE3_84]
    leisure_moderate: [BE3_85, BE3_86, BE3_87, BE3_88]
    transport_moderate: [BE3_91, BE3_92, BE3_93, BE3_94]
  comparator_column: pa_aerobic
  formulas:
    total_vigorous_min_week: work_vigorous_min_week + leisure_vigorous_min_week
    total_moderate_min_week: work_moderate_min_week + leisure_moderate_min_week + transport_moderate_min_week
    total_moderate_equivalent_min_week: total_moderate_min_week + 2 * total_vigorous_min_week
    pa_aerobic_reproduced: total_moderate_min_week >= 150 OR total_vigorous_min_week >= 75 OR total_moderate_equivalent_min_week >= 150
  eligibility: all_five_branches_must_be_no_or_yes_with_valid_duration
  output_dtype: nullable_binary

official_pa_muscle_reproduction:
  role: audit_comparator
  raw_column: BE5_1
  raw_code_to_days:
    1: 0
    2: 1
    3: 2
    4: 3
    5: 4
    6: 5_plus
    8: structural_not_applicable
    9: unknown_or_nonresponse
  reproduced_positive_raw_codes: [3, 4, 5, 6]
  note: raw_code_greater_than_or_equal_to_2_is_incorrect

app_aligned_leisure_feature:
  output: leisure_aerobic_moderate_equivalent_min_week
  unit: moderate_equivalent_minutes_per_week
  role: primary_activity_feature_in_F2_leisure
  knhanes_formula: leisure_moderate_min_week + 2 * leisure_vigorous_min_week
  knhanes_required_branches: [leisure_moderate, leisure_vigorous]
  app_inputs:
    aerobic_days_week:
      dtype: integer
      valid_range: [0, 7]
    aerobic_minutes_per_session:
      dtype: float
      valid_range: [0, 1440]
    aerobic_typical_intensity:
      dtype: categorical
      allowed_values: [moderate, vigorous]
  app_formula_by_intensity:
    moderate: aerobic_days_week * aerobic_minutes_per_session
    vigorous: 2 * aerobic_days_week * aerobic_minutes_per_session
  consistency:
    zero_days: minutes_must_be_zero_or_missing_and_intensity_may_be_missing
    positive_days: minutes_must_be_positive_and_intensity_required
  limitations:
    - app_typical_intensity_simplifies_mixed_intensity_sessions
    - knhanes_leisure_feature_can_combine_moderate_and_vigorous_exactly
    - identical_numeric_unit_does_not_remove_self_report_measurement_error
    - official_pa_aerobic_must_not_fill_missing_leisure_feature

strength_model_feature:
  output: strength_days_week
  unit: days_per_week
  mapping:
    1: 0
    2: 1
    3: 2
    4: 3
    5: 4
    6: 5
  top_code_raw: 6
  top_code_meaning: 5_or_more_days
  emit_top_coded_flag: true
  codes_8_9_and_missing: missing_not_zero

outputs:
  model_candidate:
    - leisure_aerobic_moderate_equivalent_min_week
    - strength_days_week
  audit_only:
    - pa_aerobic_reproduced
    - pa_aerobic_official
    - pa_aerobic_match
    - pa_muscle_reproduced
    - total_moderate_min_week
    - total_vigorous_min_week
    - total_moderate_equivalent_min_week
    - leisure_meets_150_equivalent
  quality_flags:
    - strength_top_coded
    - leisure_activity_complete
    - total_activity_complete

prohibited:
  - infer_frequency_or_minutes_from_pa_aerobic
  - label_moderate_equivalent_minutes_as_MET_minutes
  - convert_unknown_or_structural_not_applicable_to_zero
  - combine_work_or_transport_activity_into_app_leisure_feature
  - use_recommendation_threshold_as_diabetes_or_hypertension_target
  - use_2022_or_2023_for_model_tuning
  - read_2024_values
  - train_models_before_do_not_train_is_removed

