schema_version: 1
protocol_version: v0.1
status: joint_review_pending
do_not_train: true
do_not_open_2022_before_freeze: true
do_not_access_2023: true
do_not_access_2024: true

objective:
  product: TMTN
  population: knhanes_adults_age_19_plus_nonpregnant
  outputs:
    - estimated_waist_cm
    - diabetes_measurement_abnormality_probability
    - hypertension_measurement_abnormality_probability
  output_interpretation:
    disease_probabilities: current_single_visit_measurement_abnormality_reference
    prohibited:
      - future_incidence_probability
      - clinical_diagnosis
      - treatment_recommendation
  tmtn_index:
    included_in_this_protocol: false
    reason: requires_separately_validated_composite_formula

contracts:
  data: contracts/data_contract_v0_3.yaml
  canonical: contracts/canonical_etl_contract_v0_1.yaml
  activity: contracts/activity_feature_contract_v0_1.yaml
  measurement_harmonization: contracts/measurement_harmonization_contract_v0_1.yaml
  split_review: contracts/split_contract_v0_1.yaml
  custodian_2023: contracts/custodian_2023_operation_contract_v0_2.yaml

year_roles:
  development:
    years: [2019, 2020, 2021]
    allowed:
      - eda
      - candidate_comparison
      - hyperparameter_selection
      - feature_set_comparison
      - out_of_fold_prediction
      - calibration_fit_from_cross_fitted_predictions
      - missing_policy_development
  temporal_validation:
    years: [2022]
    role: evaluation_only_after_full_development_freeze
    prohibited:
      - model_selection
      - hyperparameter_selection
      - feature_selection
      - preprocessing_fit
      - missing_policy_selection
      - calibration_fit
      - threshold_selection
    reuse_policy: any_change_informed_by_2022_creates_new_version_and_consumes_pristine_status
  opened_internal_benchmark:
    years: [2023]
    access: custodian_only
    model_developer_row_access: prohibited
    tuning_on_result: prohibited_for_same_version
  forbidden:
    years: [2024]
    action_if_present: fail_closed_without_filtering
  independent_final_evaluation:
    dataset: future_knhanes_year_or_external_cohort
    status: pending_dataset

record_identity:
  columns: [source_year, participant_id]
  missing_or_duplicate: fail_closed
  source_row_number_as_model_key: prohibited

primary_features:
  F2_leisure:
    - age_years
    - sex_code
    - height_cm
    - weight_kg
    - leisure_aerobic_moderate_equivalent_min_week
    - strength_days_week
  roles:
    F0:
      columns: [age_years, sex_code, height_cm, weight_kg]
      role: baseline_and_separate_optional_input_fallback
    F2_leisure:
      role: primary_six_feature_model
    F1:
      role: disabled_by_default_non_app_aligned_comparator
    F2_total:
      role: research_only
  deterministic_additional_features:
    default: prohibited_without_new_protocol_version
    note: bmi_is_not_a_seventh_raw_input_but_is_not_enabled_in_v0_1

preprocessing:
  fit_scope: current_training_partition_only
  continuous:
    columns:
      - age_years
      - height_cm
      - weight_kg
      - leisure_aerobic_moderate_equivalent_min_week
      - estimated_waist_cm
    scaling:
      linear_models: standard_scaler_fit_within_fold
      tree_models: no_scaling_unless_pipeline_declares_it
  categorical:
    sex_code:
      allowed_knhanes_values: [1, 2]
      encoding: fixed_schema_one_hot_or_declared_binary_mapping
    strength_days_week:
      allowed_values: [0, 1, 2, 3, 4, 5_plus]
      encoding: fixed_schema_one_hot
      convert_5_plus_to_6: prohibited
  unknown_category: fail_or_return_unsupported_according_to_frozen_input_contract
  leakage_protection:
    fit_scaler_imputer_encoder_outside_training_partition: prohibited
    inspect_2022_distribution_before_freeze: prohibited

missing_data:
  target_imputation: prohibited
  primary_F2_analysis: complete_case
  zero_fill_unknown_activity: prohibited
  generic_mean_imputation: prohibited_in_v0_1
  structural_no_activity_zero:
    allowed_only_when_explicit_branch_nonparticipation_is_confirmed: true
  F0_fallback:
    separate_model: true
    must_not_be_reported_as_F2_prediction: true
  missing_indicator_candidates: disabled_until_new_protocol_version

development_resampling:
  random_auxiliary_80_20:
    years: [2019, 2020, 2021]
    seed: 42
    role: auxiliary_reproducibility_comparison_only
    must_not_drive_final_selection_alone: true
  official_nested_cross_fitting:
    outer_folds: 5
    outer_seed: 42
    inner_folds: 4
    inner_seed: 4201
    assignment_saved_by_composite_key: true
    task_stratification:
      waist: balance_by_source_year_sex_and_predeclared_target_quantile_when_feasible
      diabetes: stratify_by_label_with_year_and_sex_balance_checks
      hypertension: stratify_by_label_with_year_and_sex_balance_checks
    insufficient_stratum_policy: deterministic_merge_rule_recorded_before_fit
    repeated_stability_analysis:
      enabled: true
      repeats: 3
      seeds: [42, 1042, 2042]
      role: uncertainty_and_stability_not_primary_prediction_artifact

waist_submodel:
  task: regression
  target: waist_cm
  target_eligibility: waist_target_eligible
  input_tiers:
    W0:
      feature_set: F0
      role: baseline
    W2:
      feature_set: F2_leisure
      role: primary_candidate
  candidate_models:
    - linear_regression
    - elastic_net
    - random_forest_regressor
  hyperparameters:
    selection_scope: inner_development_folds_only
    grid_must_be_frozen_before_first_fit: true
  selection:
    primary_metric: mae_cm
    tie_breakers: [rmse_cm, worst_predeclared_subgroup_mae_cm, model_simplicity]
    2022_metric_use: prohibited
  cross_fitted_output:
    column: estimated_waist_cm
    every_development_row_must_be_predicted_by_model_not_fit_on_that_row: true
    measured_waist_as_disease_input: prohibited
    rows_without_measured_waist_may_receive_prediction_when_inputs_complete: true
  evaluation_metrics:
    primary: [mae_cm]
    secondary:
      - rmse_cm
      - median_absolute_error_cm
      - r2
      - mean_absolute_percentage_error
      - within_3cm_rate
      - within_5cm_rate
      - within_10cm_rate
      - residual_mean
      - residual_standard_deviation
    target_2_to_3_percent:
      status: research_goal_not_release_gate
      reason: exact_relative_error_definition_not_yet_jointly_frozen

disease_models:
  tasks:
    diabetes:
      target: diabetes_measurement_label_raw
      eligibility: diabetes_target_eligible
    hypertension:
      target: hypertension_measurement_label_raw
      eligibility: hypertension_target_eligible
  pipelines:
    D0:
      inputs: [F2_leisure]
      role: direct_input_primary_baseline
    D1:
      inputs: [F2_leisure, nested_cross_fitted_estimated_waist_cm]
      role: estimated_waist_incremental_value_candidate
    matched_D0:
      inputs: [F2_leisure]
      row_keys: exactly_match_D1
      role: fair_incremental_comparison
    F0_fallback:
      inputs: [F0]
      role: separately_labeled_optional_input_fallback
  candidate_models:
    - logistic_regression_class_weight_none
    - logistic_regression_class_weight_balanced
    - random_forest_class_weight_none
    - random_forest_class_weight_balanced
  nested_upstream_waist_rule:
    outer_holdout_keys_excluded_from_all_upstream_fit_and_selection: true
    outer_train_estimated_waist_generated_by_inner_cross_fitting: true
    outer_holdout_estimated_waist_generated_by_waist_model_fit_on_outer_train_only: true
  selection:
    primary_metric: cross_fitted_calibrated_brier_score
    tie_breakers:
      - cross_fitted_log_loss
      - calibration_slope_distance_from_1
      - calibration_intercept_distance_from_0
      - pr_auc
      - roc_auc
      - model_simplicity
    2022_metric_use: prohibited
  evaluation_metrics:
    discrimination: [roc_auc, pr_auc]
    overall_accuracy: [brier_score, log_loss]
    calibration:
      - calibration_intercept
      - calibration_slope
      - ece_with_frozen_bin_definition
      - calibration_table

calibration:
  fit_source: 2019_2021_cross_fitted_out_of_fold_predictions_only
  candidate_methods:
    - identity_no_recalibration
    - platt_unpenalized_logistic_recalibration
  selection_scope: development_only
  isotonic:
    enabled: false
    activation_requires_new_protocol_version: true
  diagnostics:
    calibration_intercept_and_slope_fit: unpenalized_logistic_regression
    ece_bins: 10
    ece_bin_method: quantile_bins_frozen_from_development_definition
  fit_on_2022: prohibited
  fit_on_2023: prohibited

survey_design_evaluation:
  primary_training: unweighted
  mandatory_sensitivity:
    - unweighted_metrics
    - examination_weighted_metrics
  weight_column: examination_weight
  strata_column: strata
  psu_column: psu
  missing_weight_policy:
    imputation: prohibited
    report_valid_weight_coverage: required
    exact_analysis_rule_status: pending_joint_freeze
  design_based_uncertainty:
    required_for_release: true
    method_status: pending_joint_freeze

subgroups:
  required:
    - source_year
    - sex_code
    - age_band
  age_bands:
    - {label: age_19_39, minimum: 19, maximum: 39}
    - {label: age_40_64, minimum: 40, maximum: 64}
    - {label: age_65_plus, minimum: 65, maximum: null}
  optional_intersections: [sex_by_age_band]
  privacy_minimum_cell_count: 5
  minimum_events_for_stable_metric:
    status: pending_joint_freeze
  insufficient_support: suppress_metric_and_report_insufficient_support
  required_metrics:
    waist: [n, mae_cm, rmse_cm, residual_mean]
    disease: [n, events, prevalence, roc_auc, pr_auc, brier_score, calibration_intercept, calibration_slope]

uncertainty:
  confidence_level: 0.95
  development_cv:
    report_fold_and_repeat_distribution: true
  temporal_validation_2022:
    confidence_intervals_required: true
    bootstrap_or_design_based_method_status: pending_joint_freeze
  multiple_candidate_comparison:
    report_all_predeclared_candidates: true
    cherry_pick_only_best_table: prohibited

temporal_validation_2022:
  prerequisites:
    - candidate_registry_frozen
    - hyperparameter_grids_frozen
    - fold_registry_frozen
    - feature_and_missing_policy_frozen
    - preprocessing_frozen
    - calibration_method_selected_and_fit_on_development_oof
    - metric_and_subgroup_plan_frozen
    - code_and_environment_hashes_recorded
  fitting_on_2022: prohibited
  output:
    - aggregate_overall_metrics
    - aggregate_subgroup_metrics
    - weighted_sensitivity_metrics
    - calibration_tables
    - gate_decisions
  if_result_informs_change:
    action: create_new_experiment_version
    record_2022_as_opened_developmental_validation_for_later_versions: true

freeze_and_bundle:
  training_years_for_2023_bundle: [2019, 2020, 2021]
  include_2022_in_refit: false
  reason: preserve_declared_2022_evaluation_only_role
  required_artifacts:
    - fold_registry
    - candidate_registry
    - selected_hyperparameters
    - task_models
    - task_preprocessors
    - task_calibrators
    - input_output_schemas
    - evaluation_plan
    - model_cards
    - dependency_lock
    - SHA256SUMS
  bundle_contract: contracts/custodian_2023_operation_contract_v0_2.yaml

release_gates:
  mandatory:
    - schema_and_contract_match
    - no_target_or_measurement_leakage
    - outer_fold_and_inner_fold_key_disjointness
    - no_2022_fit_or_selection
    - no_2023_or_2024_access
    - deterministic_reproduction
    - overall_performance
    - calibration
    - temporal_stability
    - subgroup_performance
    - weighted_sensitivity
    - safety_wording_approval
  numeric_thresholds:
    status: pending_joint_freeze_before_do_not_train_is_removed
    rule: no_real_training_authorization_until_thresholds_are_versioned
  D1_adoption:
    rule: adopt_only_if_incremental_value_over_matched_D0_is_reproducible_and_calibration_not_worse
    no_improvement_action: retain_D0_and_do_not_add_estimated_waist_to_disease_model

reproducibility:
  global_seed: 42
  required_links:
    - raw_input_sha256
    - canonical_snapshot_id_and_sha256
    - task_frame_sha256
    - contract_versions_and_sha256
    - fold_registry_sha256
    - code_commit_or_sha256
    - python_version
    - dependency_lock_sha256
    - model_version
    - preprocessor_version
    - calibration_version
  same_input_same_version_tolerance:
    deterministic_models: exact
    platform_sensitive_models: numeric_tolerance_must_be_predeclared

approvals_before_training:
  required:
    - kangho
    - byeonghak
    - numeric_release_thresholds
    - survey_weight_missing_policy
    - uncertainty_method
    - model_candidate_hyperparameter_grids
    - serving_valid_ranges_and_unsupported_input_policy
    - new_authorized_training_contract_with_do_not_train_false

prohibited_actions:
  - train_using_this_review_protocol_while_do_not_train_true
  - fit_any_transformer_before_partitioning
  - use_measured_waist_as_D1_disease_input
  - select_or_calibrate_on_2022
  - access_row_level_2023
  - tune_on_2023_aggregate_result
  - access_2024
  - create_tmtn_index_by_unvalidated_average

